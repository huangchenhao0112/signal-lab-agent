events {
    worker_connections 1024;
}


http {

    limit_req_zone
        $binary_remote_addr
        zone=agent_limit:10m
        rate=5r/s;


    upstream agent_backend {
        server agent-api:8000;
    }


    server {

        listen 80;

        location /api/ {

            limit_req
                zone=agent_limit
                burst=10
                nodelay;
                limit_req_status 429;

            proxy_pass
                http://agent_backend/;

            proxy_set_header
                Host
                $host;

            proxy_set_header
                X-Real-IP
                $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;
        }
    }
}