name: SignalLab Fast Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run fast tests
        run: |
          python -m pytest \
            -m "not integration and not e2e and not ui" \
            --cov=app \
            --cov=agent \
            --cov=tools \
            --cov-report=term-missing