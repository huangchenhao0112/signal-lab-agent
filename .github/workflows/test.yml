name: SignalLab Fast Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: signal_lab_agent
          MYSQL_USER: signal_agent
          MYSQL_PASSWORD: agent123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot123456"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_NAME: SignalLab Agent
      APP_VERSION: 0.1.0

      LLM_API_KEY: test-llm-key
      LLM_BASE_URL: https://example.com
      LLM_MODEL: test-model
      LLM_TIMEOUT: 60

      EMBEDDING_API_KEY: test-embedding-key
      EMBEDDING_BASE_URL: https://example.com
      EMBEDDING_MODEL: test-embedding-model
      EMBEDDING_DIMENSIONS: 1024

      CHROMA_DIR: data/chroma
      CHROMA_COLLECTION: signal_knowledge
      TOP_K: 3

      RERANK_MODEL: test-rerank
      RERANK_URL: https://example.com/reranks
      RERANK_MIN_SCORE: 0.20

      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_SESSION_TTL_SECONDS: 1800

      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: signal_lab_agent
      MYSQL_USER: signal_agent
      MYSQL_PASSWORD: agent123456

      JWT_SECRET_KEY: test-ci-jwt-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run fast tests
        run: |
          python -m pytest \
            -m "not integration and not e2e and not ui" \
            --cov=app \
            --cov=agent \
            --cov=tools \
            --cov-report=term-missing