services:

  mysql:
    image: mysql:8.4
    container_name: signal-lab-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: signal_lab_agent
      MYSQL_USER: signal_agent
      MYSQL_PASSWORD: agent123456

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p123456"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  redis:
    image: redis:7
    container_name: signal-lab-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  agent-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: signal-lab-agent-api

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: signal_lab_agent
      MYSQL_USER: signal_agent
      MYSQL_PASSWORD: agent123456

      REDIS_URL: redis://redis:6379/0

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/agent/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  gateway:
    image: nginx:latest
    container_name: signal-lab-gateway

    restart: unless-stopped

    depends_on:
      agent-api:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro


volumes:

  mysql_data:

  redis_data: